# Scrape config for this stack. PodMonitors (not ServiceMonitors) because the
# stable and canary Services can select the same pods, which would double-count.
# rollouts-pod-template-hash is copied onto every series so analysis can
# isolate canary pods.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: api
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "app.selector" (dict "component" "api" "root" .) | nindent 6 }}
  podTargetLabels: [rollouts-pod-template-hash]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: worker
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "app.selector" (dict "component" "worker" "root" .) | nindent 6 }}
  podTargetLabels: [rollouts-pod-template-hash]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- if .Values.valkeyMetrics }}
---
# redis_exporter sidecar run by the provider layer next to Valkey (local only).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  endpoints:
    - port: metrics
      interval: 15s
{{- end }}
{{- if .Values.dbMetrics }}
---
# The provider layer's CloudNativePG exporters (local only). PgBouncer's pool
# waits (cnpg_pgbouncer_pools_cl_waiting, _maxwait) are what separate "the app
# is slow" from "the app is waiting for a database connection".
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pgbouncer
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    matchExpressions:
      - key: cnpg.io/poolerName
        operator: Exists
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
{{- end }}
