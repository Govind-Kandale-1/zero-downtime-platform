# Provider contract item 3 -> Secret app-env (DATABASE_URL,
# MIGRATION_DATABASE_URL, REDIS_URL). The store is named, not described:
# OpenBao locally, AWS Secrets Manager on AWS (ADR-009).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-env
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: app-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "stacks/%s/app" .Values.stack.name }}
