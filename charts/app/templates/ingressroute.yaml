apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  entryPoints: [web]
  routes:
    {{- range (fromYamlArray (include "app.hosts" .)) }}
    - match: Host(`{{ . }}`)
      kind: Rule
      services:
        - name: api
          kind: TraefikService
    {{- end }}
