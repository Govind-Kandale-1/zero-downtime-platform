# Worker autoscaling on queue depth (ADR-013): desired = pending jobs / listLength.
# Scale-in is safe because each worker finishes its job on SIGTERM within the
# 90 s grace period, and a killed worker's job is reaped back to the queue.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: worker
  minReplicaCount: {{ .Values.worker.minReplicas }}
  maxReplicaCount: {{ .Values.worker.maxReplicas }}
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 10
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
  triggers:
    - type: redis
      {{- if not .Values.queue.address }}
      authenticationRef:
        name: worker-queue
      {{- end }}
      metadata:
        {{- with .Values.queue.address }}
        address: {{ . }}
        {{- end }}
        {{- if .Values.queue.tls }}
        enableTLS: "true"
        {{- end }}
        listName: jobs
        listLength: {{ .Values.worker.listLength | quote }}
{{- if not .Values.queue.address }}
---
# The queue's host:port, from the stack secret (QUEUE_ADDRESS, derived by the
# ExternalSecret from REDIS_URL): the same lookup on every provider.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: worker-queue
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: address
      name: app-env
      key: QUEUE_ADDRESS
{{- end }}
