# Stack descriptor (read by Terraform infra/live/local/20-data) and Helm values
# for charts/app (read by Argo CD). prod is the shared stack: shared tenants are
# host routes onto it (tenants/*.yaml with tier: shared). It is release ring 0.
stack:
  name: prod
  namespace: app-prod
  tier: shared
  release: prod-ring0
  residency: eu
  region: eu-central-1
  size: small
  slo: "99.9"

# --- app values (charts/app) ---
# Shared prod stack. Autoscaling target from the measured per-pod capacity
# (docs/capacity.md): C ~ 180 req/s at p95 < 400 ms, target = 0.7 x C = 126,
# max = ceil(2250 / 126) + 3 (canary + headroom) = 21. Worker max 60: Little's law
# needs ~56 at 5.56 jobs/s x 10 s (ADR-024); the chart default 120 adds burst room.
api:
  minReplicas: 3
  maxReplicas: 21
  rpsPerPod: 126
  pauseSeconds: 60
worker:
  minReplicas: 2
  maxReplicas: 60
  pauseSeconds: 60
