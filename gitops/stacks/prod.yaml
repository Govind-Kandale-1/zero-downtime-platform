# Stack descriptor (read by Terraform infra/live/local/20-data) and Helm values
# for charts/app (read by Argo CD). prod is the shared stack: shared tenants are
# host routes onto it (tenants/*.yaml with tier: shared). It is release ring 0.
stack:
  name: prod
  namespace: app-prod
  tier: shared
  release: prod-ring0
  residency: eu
  region: eu-central-1
  size: small
  slo: "99.9"

# --- app values (charts/app) ---
# Shared prod stack: HA minimum of 3 API pods. maxReplicas are laptop caps
# (labelled); api.rpsPerPod is recalibrated from the load test.
api:
  minReplicas: 3
  maxReplicas: 40
  pauseSeconds: 60
worker:
  minReplicas: 2
  maxReplicas: 60
  pauseSeconds: 60
