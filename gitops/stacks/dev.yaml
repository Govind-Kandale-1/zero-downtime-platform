# Stack descriptor (read by Terraform infra/live/local/20-data) and Helm values
# for charts/app (read by Argo CD). One file per environment stack.
stack:
  name: dev
  namespace: app-dev
  tier: nonprod
  release: dev
  residency: eu
  region: eu-central-1
  size: tiny
  slo: "99.9"

# --- app values (charts/app) ---
# Non-prod: one API/worker pod is enough; short canary pauses for fast feedback.
api:
  minReplicas: 1
  maxReplicas: 3
  pauseSeconds: 60
worker:
  minReplicas: 1
  maxReplicas: 5
  pauseSeconds: 60
