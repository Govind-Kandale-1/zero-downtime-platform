# NOT RUN. Same as the local cluster (ADR-016): constant low traffic to every
# stack, so canary analysis and the promotion gate always have data. On AWS
# that matters even more at night, when real traffic can fall below the
# analysis minimum of 20 requests per minute.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synthetic-traffic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Govind-Kandale-1/zero-downtime-platform.git
    targetRevision: main
    path: gitops/platform/synthetic-traffic
  destination:
    server: https://kubernetes.default.svc
    namespace: synthetic
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
