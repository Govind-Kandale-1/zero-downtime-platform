# NOT RUN. Wave -1: node autoscaling (AWS-specific; listed in docs/non-portable.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.15.1
      helm:
        releaseName: karpenter
        valueFiles: [$values/gitops/platform/values/aws/karpenter.yaml]
    - repoURL: https://github.com/Govind-Kandale-1/zero-downtime-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
