# App-of-apps root for the local cluster. Applied once by Terraform
# (infra/live/local/30-gitops); after that Argo CD reconciles every manifest
# under gitops/clusters/local/apps/ from the main branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Govind-Kandale-1/zero-downtime-platform.git
    targetRevision: main
    path: gitops/clusters/local/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
