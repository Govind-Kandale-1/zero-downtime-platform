# Wave -1: External Secrets Operator: syncs the secrets manager into
# per-stack Kubernetes Secrets (ADR-009). The namespace and its OpenBao token
# Secret are created by Terraform (infra/modules/local/data-operators).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles: [$values/gitops/platform/values/local/external-secrets.yaml]
    - repoURL: https://github.com/Govind-Kandale-1/zero-downtime-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
