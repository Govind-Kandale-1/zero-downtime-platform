# Wave -1: progressive delivery controller (canary steps, analysis, abort).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.8
      helm:
        releaseName: argo-rollouts
        valueFiles: [$values/gitops/platform/values/local/argo-rollouts.yaml]
    - repoURL: https://github.com/Govind-Kandale-1/zero-downtime-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
