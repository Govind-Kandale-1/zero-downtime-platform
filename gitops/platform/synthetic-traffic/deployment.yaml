# Synthetic traffic (ADR-016). Scaled to 0 with a placeholder image until the
# first release is published; the bring-up step then pins the image digest and
# sets replicas: 1 (a deliberate, reviewed manual change).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-traffic
  labels:
    app.kubernetes.io/name: synthetic-traffic
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-traffic
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: synthetic
          image: ghcr.io/govind-kandale-1/zero-downtime-platform:placeholder
          command: ["/synthetic"]
          env:
            - name: TRAFFIC_TARGET
              value: http://traefik.traefik.svc
            - name: HOSTS
              value: dev.localtest.me,staging.localtest.me,prod.localtest.me,initech.localtest.me,acme.localtest.me,globex.localtest.me
            - name: RPS_PER_HOST
              value: "10"
            - name: JOB_EVERY
              value: 10s
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
