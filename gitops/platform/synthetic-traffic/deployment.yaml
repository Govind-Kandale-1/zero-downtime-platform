# Synthetic traffic (ADR-016). Pinned by digest to the first published image
# (a deliberate, reviewed change - this tooling never moves with app releases).
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-traffic
  labels:
    app.kubernetes.io/name: synthetic-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthetic-traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthetic-traffic
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: synthetic
          image: ghcr.io/govind-kandale-1/zero-downtime-platform@sha256:f91b81a532996c027e73b3c689246593d7d95400f055a41e2177241c894bc4e7
          command: ["/synthetic"]
          env:
            - name: TRAFFIC_TARGET
              value: http://traefik.traefik.svc
            - name: HOSTS
              value: dev.localtest.me,staging.localtest.me,prod.localtest.me,initech.localtest.me,acme.localtest.me,globex.localtest.me
            - name: RPS_PER_HOST
              value: "10"
            - name: JOB_EVERY
              value: 10s
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
