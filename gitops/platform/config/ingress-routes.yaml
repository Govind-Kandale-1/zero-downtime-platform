# UIs on http://<name>.localtest.me (localtest.me resolves to 127.0.0.1).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.localtest.me`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [web]
  routes:
    - match: Host(`grafana.localtest.me`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints: [web]
  routes:
    - match: Host(`prometheus.localtest.me`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rollouts
  namespace: argo-rollouts
spec:
  entryPoints: [web]
  routes:
    - match: Host(`rollouts.localtest.me`)
      kind: Rule
      services:
        - name: argo-rollouts-dashboard
          port: 3100
