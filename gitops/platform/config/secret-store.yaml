# The one place the secrets backend is named. Every stack's ExternalSecret
# refers to "platform-secrets"; on AWS this object points at Secrets Manager
# with Pod Identity instead (gitops/platform/values/aws). ADR-009.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          namespace: external-secrets
          key: token
