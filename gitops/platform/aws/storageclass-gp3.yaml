# NOT RUN. The default StorageClass on AWS: encrypted gp3 through the EBS CSI
# driver (which gets its credentials from Pod Identity, infra/modules/aws/eks).
# Volumes bind where the pod lands (WaitForFirstConsumer), so a zonal EBS
# volume always matches its pod's AZ.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
