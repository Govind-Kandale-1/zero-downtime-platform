# NOT RUN. Headroom for the first seconds of a 15x burst: pause pods at
# priority -10 hold ~3 nodes' worth of capacity. When real pods need room the
# scheduler evicts these instantly (no node wait); the evicted pause pods go
# Pending, which makes Karpenter add nodes in the background (~60-90 s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioning
  namespace: kube-system
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: overprovisioning }
  template:
    metadata:
      labels: { app.kubernetes.io/name: overprovisioning }
    spec:
      priorityClassName: overprovision
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: "1500m", memory: 3Gi }
