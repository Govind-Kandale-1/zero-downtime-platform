# NOT RUN. Same name as the local store, different backend: every stack's
# ExternalSecret is unchanged. Credentials come from EKS Pod Identity on the
# external-secrets service account (no static token).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
