# Source: app/templates/api-rollout.yaml
# API: canary with Traefik traffic splitting, gated by Prometheus analysis of
# edge metrics; automatic abort returns 100% of traffic to stable (ADR-011).
# spec.replicas is intentionally absent: KEDA owns the replica count.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: prod
        app.kubernetes.io/part-of: zero-downtime-platform
        app.kubernetes.io/managed-by: Helm
        zdp/stack: prod
        zdp/tier: shared
        zdp/region: eu-central-1
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      priorityClassName: app
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: prod
      containers:
        - name: api
          image: ghcr.io/govind-kandale-1/zero-downtime-platform@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: MAX_INFLIGHT
              value: "8"
            - name: WORK_LATENCY_MS
              value: "40"
          # Migrations run at boot: startup probe tolerates up to 60 s before
          # liveness takes over; readiness keeps traffic away until /readyz is 200.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving while endpoint removal propagates to Traefik, then the
          # app's own SIGTERM handling drains in-flight requests.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      stableService: api-stable
      canaryService: api-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: api
      analysis:
        templates:
          - templateName: api-canary
        startingStep: 1
      steps:
        - setWeight: 10
        - pause: { duration: 120s }
        - setWeight: 25
        - pause: { duration: 120s }
        - setWeight: 50
        - pause: { duration: 120s }
---
# Source: app/templates/worker-rollout.yaml
# Worker: a gated rolling update - a Rollouts canary without traffic routing,
# so "weight" is the share of replicas - with automatic abort on analysis
# failure (ADR-012). A plain Deployment would roll the same way but could not
# roll itself back. spec.replicas is absent: KEDA owns it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: prod
        app.kubernetes.io/part-of: zero-downtime-platform
        app.kubernetes.io/managed-by: Helm
        zdp/stack: prod
        zdp/tier: shared
        zdp/region: eu-central-1
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      priorityClassName: app
      # Longest job is 60 s: SIGTERM -> stop claiming -> finish the job in hand.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
              app.kubernetes.io/instance: prod
      containers:
        - name: worker
          image: ghcr.io/govind-kandale-1/zero-downtime-platform@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          command: ["/worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: app-env
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      maxSurge: "25%"
      maxUnavailable: 0
      analysis:
        templates:
          - templateName: worker-canary
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
        startingStep: 1
      steps:
        - setWeight: 25
        - pause: { duration: 180s }
        - setWeight: 50
        - pause: { duration: 180s }
