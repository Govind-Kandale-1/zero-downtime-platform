# Source: app/templates/prometheusrule-slo.yaml
# SLOs for this stack, measured at the edge (Traefik):
#   availability = non-5xx / all requests
#   latency      = requests answered in <= 400 ms / all requests
# Multi-window, multi-burn-rate alerts (Google SRE workbook, ADR-023):
#   page   : 14.4x budget burn over 1h AND 5m, or 6x over 6h AND 30m
#   ticket : 1x over 3d
# Objective 0.999 -> error budget 0.001.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  groups:
    - name: zdp-sli-prod
      interval: 30s
      rules:
        - record: zdp:sli_availability:ratio_rate5m
          expr: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*",code!~"5.."}[5m]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[5m]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_latency_good:ratio_rate5m
          expr: |
            sum(rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-(stable|canary)-.*",le="0.4"}[5m]))
            /
            sum(rate(traefik_service_request_duration_seconds_count{service=~"app-prod-api-(stable|canary)-.*"}[5m]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_availability:ratio_rate30m
          expr: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*",code!~"5.."}[30m]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[30m]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_latency_good:ratio_rate30m
          expr: |
            sum(rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-(stable|canary)-.*",le="0.4"}[30m]))
            /
            sum(rate(traefik_service_request_duration_seconds_count{service=~"app-prod-api-(stable|canary)-.*"}[30m]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_availability:ratio_rate1h
          expr: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*",code!~"5.."}[1h]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[1h]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_latency_good:ratio_rate1h
          expr: |
            sum(rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-(stable|canary)-.*",le="0.4"}[1h]))
            /
            sum(rate(traefik_service_request_duration_seconds_count{service=~"app-prod-api-(stable|canary)-.*"}[1h]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_availability:ratio_rate6h
          expr: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*",code!~"5.."}[6h]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[6h]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_latency_good:ratio_rate6h
          expr: |
            sum(rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-(stable|canary)-.*",le="0.4"}[6h]))
            /
            sum(rate(traefik_service_request_duration_seconds_count{service=~"app-prod-api-(stable|canary)-.*"}[6h]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_availability:ratio_rate3d
          expr: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*",code!~"5.."}[3d]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[3d]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
        - record: zdp:sli_latency_good:ratio_rate3d
          expr: |
            sum(rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-(stable|canary)-.*",le="0.4"}[3d]))
            /
            sum(rate(traefik_service_request_duration_seconds_count{service=~"app-prod-api-(stable|canary)-.*"}[3d]))
          labels:
            namespace: app-prod
            stack: prod
            tier: shared
    - name: zdp-slo-alerts-prod
      rules:
        - alert: ZdpErrorBudgetBurnPage
          expr: |
            (
              (1 - zdp:sli_availability:ratio_rate1h{namespace="app-prod"}) > (14.4 * 0.001)
              and
              (1 - zdp:sli_availability:ratio_rate5m{namespace="app-prod"}) > (14.4 * 0.001)
            )
            or
            (
              (1 - zdp:sli_availability:ratio_rate6h{namespace="app-prod"}) > (6 * 0.001)
              and
              (1 - zdp:sli_availability:ratio_rate30m{namespace="app-prod"}) > (6 * 0.001)
            )
          labels:
            severity: page
            sli: availability
            stack: prod
            tier: shared
            objective: "0.999"
          annotations:
            summary: "prod: availability error budget burning fast"
            runbook_url: https://github.com/Govind-Kandale-1/zero-downtime-platform/blob/main/docs/runbooks/burn-rate-page.md
        - alert: ZdpErrorBudgetBurnTicket
          expr: |
            (1 - zdp:sli_availability:ratio_rate3d{namespace="app-prod"}) > 0.001
          labels:
            severity: ticket
            sli: availability
            stack: prod
            tier: shared
            objective: "0.999"
          annotations:
            summary: "prod: availability error budget exhausted over 3 days"
            runbook_url: https://github.com/Govind-Kandale-1/zero-downtime-platform/blob/main/docs/runbooks/burn-rate-page.md
        - alert: ZdpErrorBudgetBurnPage
          expr: |
            (
              (1 - zdp:sli_latency_good:ratio_rate1h{namespace="app-prod"}) > (14.4 * 0.001)
              and
              (1 - zdp:sli_latency_good:ratio_rate5m{namespace="app-prod"}) > (14.4 * 0.001)
            )
            or
            (
              (1 - zdp:sli_latency_good:ratio_rate6h{namespace="app-prod"}) > (6 * 0.001)
              and
              (1 - zdp:sli_latency_good:ratio_rate30m{namespace="app-prod"}) > (6 * 0.001)
            )
          labels:
            severity: page
            sli: latency_good
            stack: prod
            tier: shared
            objective: "0.999"
          annotations:
            summary: "prod: latency_good error budget burning fast"
            runbook_url: https://github.com/Govind-Kandale-1/zero-downtime-platform/blob/main/docs/runbooks/burn-rate-page.md
        - alert: ZdpErrorBudgetBurnTicket
          expr: |
            (1 - zdp:sli_latency_good:ratio_rate3d{namespace="app-prod"}) > 0.001
          labels:
            severity: ticket
            sli: latency_good
            stack: prod
            tier: shared
            objective: "0.999"
          annotations:
            summary: "prod: latency_good error budget exhausted over 3 days"
            runbook_url: https://github.com/Govind-Kandale-1/zero-downtime-platform/blob/main/docs/runbooks/burn-rate-page.md
