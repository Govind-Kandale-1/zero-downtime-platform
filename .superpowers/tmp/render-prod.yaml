# Source: app/templates/api-services.yaml
# Argo Rollouts points each Service at a ReplicaSet by injecting
# rollouts-pod-template-hash into its selector; Traefik weights between them.
---
# Source: app/templates/pdb.yaml
# Voluntary disruptions (node drain, upgrades) take at most one pod at a time.
---
# Source: app/templates/analysis-api.yaml
# Canary gate for the API, evaluated on Traefik's view of the canary Service
# only. Each metric is explicit about all three outcomes:
#   success  -> keep going
#   failure  -> after failureLimit+1 failures the Rollout aborts automatically
#   neither (no data / NaN / too few requests) -> Inconclusive -> Rollout pauses
# so "no traffic" is never mistaken for "healthy".
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-canary
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  metrics:
    - name: canary-request-count
      interval: 1m
      initialDelay: 1m
      successCondition: "len(result) > 0 && result[0] >= 20"
      failureCondition: "false"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(increase(traefik_service_requests_total{service=~"app-prod-api-canary-.*"}[1m]))
    - name: canary-success-rate
      interval: 1m
      initialDelay: 1m
      failureLimit: 1
      successCondition: "len(result) > 0 && result[0] >= 0.99"
      failureCondition: "len(result) > 0 && result[0] < 0.99"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-canary-.*",code!~"5.."}[1m]))
            /
            sum(rate(traefik_service_requests_total{service=~"app-prod-api-canary-.*"}[1m]))
    - name: canary-p95-latency
      interval: 1m
      initialDelay: 1m
      failureLimit: 1
      successCondition: "len(result) > 0 && result[0] <= 0.4"
      failureCondition: "len(result) > 0 && result[0] > 0.4"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~"app-prod-api-canary-.*"}[1m])))
---
# Source: app/templates/analysis-worker.yaml
# Canary gate for the worker. There is no HTTP traffic to split, so the canary
# is a share of replicas, isolated in queries by its pod-template hash.
#   failure ratio : jobs failed / jobs finished by canary pods (no jobs in the
#                   window = no failures observed = pass; liveness is covered by
#                   queue age)
#   queue age     : the oldest pending job must not wait > 120 s
#   restarts      : canary worker pods must not crash-loop
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: worker-canary
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  args:
    - name: canary-hash
  metrics:
    - name: canary-job-failure-ratio
      interval: 1m
      initialDelay: 1m
      failureLimit: 1
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= 0.02"
      failureCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] > 0.02"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(jobs_processed_total{namespace="app-prod",rollouts_pod_template_hash="{{args.canary-hash}}",result="failed"}[2m]))
            /
            sum(rate(jobs_processed_total{namespace="app-prod",rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
    - name: queue-oldest-job-age
      interval: 1m
      initialDelay: 1m
      failureLimit: 1
      successCondition: "len(result) > 0 && result[0] < 120"
      failureCondition: "len(result) > 0 && result[0] >= 120"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            max(queue_oldest_job_age_seconds{namespace="app-prod"})
    - name: canary-restarts
      interval: 1m
      initialDelay: 1m
      failureLimit: 0
      successCondition: "len(result) == 0 || result[0] == 0"
      failureCondition: "len(result) > 0 && result[0] > 0"
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(increase(kube_pod_container_status_restarts_total{namespace="app-prod",container="worker"}[2m])
              * on (namespace, pod) group_left
              max by (namespace, pod) (kube_pod_labels{namespace="app-prod",label_rollouts_pod_template_hash="{{args.canary-hash}}"}))
---
