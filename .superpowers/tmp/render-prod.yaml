# Source: app/templates/scaledobject-api.yaml
# API autoscaling on request rate per pod, measured at the edge (ADR-013).
# Scale-up has no stabilisation window and may double (or add 8 pods) every
# 15 s; scale-down waits 5 minutes and sheds at most 20% per minute.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: api
  minReplicaCount: 3
  maxReplicaCount: 40
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 8
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        # AverageValue: desired replicas = total req/s / threshold.
        query: sum(rate(traefik_service_requests_total{service=~"app-prod-api-(stable|canary)-.*"}[1m]))
        threshold: "70"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
---
# Source: app/templates/scaledobject-worker.yaml
# Worker autoscaling on queue depth (ADR-013): desired = pending jobs / listLength.
# Scale-in is safe because each worker finishes its job on SIGTERM within the
# 90 s grace period, and a killed worker's job is reaped back to the queue.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  labels:
    app.kubernetes.io/part-of: zero-downtime-platform
    app.kubernetes.io/managed-by: Helm
    zdp/stack: prod
    zdp/tier: shared
    zdp/region: eu-central-1
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: worker
  minReplicaCount: 2
  maxReplicaCount: 120
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 10
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 20
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        address: valkey.app-prod.svc:6379
        listName: jobs
        listLength: "5"
---
