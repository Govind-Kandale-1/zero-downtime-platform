        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_availability:ratio_rate1h
        expr: |
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*",code!~"5.."}[1h]))
          /
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*"}[1h]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_latency_good:ratio_rate1h
        expr: |
          sum(rate(traefik_service_request_duration_seconds_bucket{service=~"tenant-acme-api-(stable|canary)-.*",le="0.4"}[1h]))
          /
          sum(rate(traefik_service_request_duration_seconds_count{service=~"tenant-acme-api-(stable|canary)-.*"}[1h]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_availability:ratio_rate6h
        expr: |
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*",code!~"5.."}[6h]))
          /
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*"}[6h]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_latency_good:ratio_rate6h
        expr: |
          sum(rate(traefik_service_request_duration_seconds_bucket{service=~"tenant-acme-api-(stable|canary)-.*",le="0.4"}[6h]))
          /
          sum(rate(traefik_service_request_duration_seconds_count{service=~"tenant-acme-api-(stable|canary)-.*"}[6h]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_availability:ratio_rate3d
        expr: |
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*",code!~"5.."}[3d]))
          /
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*"}[3d]))
        labels:
          namespace: tenant-acme
          stack: acme
