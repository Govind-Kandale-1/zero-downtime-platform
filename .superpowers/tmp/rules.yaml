groups:
  - name: zdp-sli-acme
    interval: 30s
    rules:
      - record: zdp:sli_availability:ratio_rate5m
        expr: |
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*",code!~"5.."}[5m]))
          /
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*"}[5m]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_latency_good:ratio_rate5m
        expr: |
          sum(rate(traefik_service_request_duration_seconds_bucket{service=~"tenant-acme-api-(stable|canary)-.*",le="0.4"}[5m]))
          /
          sum(rate(traefik_service_request_duration_seconds_count{service=~"tenant-acme-api-(stable|canary)-.*"}[5m]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_availability:ratio_rate30m
        expr: |
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*",code!~"5.."}[30m]))
          /
          sum(rate(traefik_service_requests_total{service=~"tenant-acme-api-(stable|canary)-.*"}[30m]))
        labels:
          namespace: tenant-acme
          stack: acme
          tier: dedicated
      - record: zdp:sli_latency_good:ratio_rate30m
        expr: |
          sum(rate(traefik_service_request_duration_seconds_bucket{service=~"tenant-acme-api-(stable|canary)-.*",le="0.4"}[30m]))
          /
