# Build once, scan, sign, and promote the SAME digest (plus the chart version)
# through dev -> staging -> [approval] -> prod ring 0 (shared stack) -> ring 1 ->
# ring 2. Every promotion is a Git commit that Argo CD pulls; every gate is a
# read-only check on real metrics. A failure anywhere halts the fleet rollout.
name: release

on:
  push:
    branches: [main]
    paths: ["app/**", "charts/**", "!**/*.md", "!app/**/*_test.go"] # docs and test-only changes cannot change the artifact
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/govind-kandale-1/zero-downtime-platform
  CHART_REPO: oci://ghcr.io/govind-kandale-1/charts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      built: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - id: changes
        name: did the app change? (chart-only changes reuse the current dev digest)
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ ! -f gitops/releases/dev.yaml ] \
             || ! git diff --quiet HEAD^ HEAD -- app/; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.app == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BASE_IMAGE=${{ env.DISTROLESS_IMAGE }}
            VERSION=${{ github.sha }}
          provenance: false
          sbom: false
      - id: result
        env:
          BUILT: ${{ steps.changes.outputs.app }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$BUILT" = true ]; then digest=$PUSHED
          else digest=$(sed -n 's/^  digest: "\(.*\)"$/\1/p' gitops/releases/dev.yaml); fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Artifact: \`$IMAGE@$digest\` (built=$BUILT)" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: vulnerability scan (fail on fixable HIGH/CRITICAL) + CycloneDX SBOM
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$REF"
          trivy image --format cyclonedx --output sbom.cdx.json "$REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  sign:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: GitHub OIDC -> Fulcio certificate -> Rekor log
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: sign the image and attest its SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

  chart:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: pkg
        name: package + push the chart as an OCI artifact, then sign it
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/app --version "$version" --app-version "${DIGEST:7:12}"
          out=$(helm push "app-$version.tgz" "$CHART_REPO" 2>&1); echo "$out"
          chart_digest=$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')
          cosign sign --yes "ghcr.io/govind-kandale-1/charts/app@$chart_digest"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Chart: \`$CHART_REPO/app:$version\` ($chart_digest)" >> "$GITHUB_STEP_SUMMARY"

  dev:
    needs: [build, chart]
    uses: ./.github/workflows/_promote.yml
    with:
      stage: dev
      stacks: dev
      environment: dev
      chart_version: ${{ needs.chart.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

  staging:
    needs: [build, chart, dev]
    uses: ./.github/workflows/_promote.yml
    with:
      stage: staging
      stacks: staging
      environment: staging
      chart_version: ${{ needs.chart.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

  prod-ring0:
    needs: [build, chart, staging]
    uses: ./.github/workflows/_promote.yml
    with:
      stage: prod-ring0
      stacks: prod
      environment: production # required reviewer
      chart_version: ${{ needs.chart.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

  ring1:
    needs: [build, chart, prod-ring0]
    uses: ./.github/workflows/_promote.yml
    with:
      stage: ring1
      stacks: acme
      environment: ring1
      chart_version: ${{ needs.chart.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}

  ring2:
    needs: [build, chart, ring1]
    uses: ./.github/workflows/_promote.yml
    with:
      stage: ring2
      stacks: globex
      environment: ring2
      chart_version: ${{ needs.chart.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
