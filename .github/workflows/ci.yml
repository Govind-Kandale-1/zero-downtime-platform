# PR validation. Every job name below is a required status check on main
# (scripts/repo-ruleset.sh), so renaming a job means updating the ruleset.
# Runs on GitHub-hosted runners only: nothing here touches a cluster.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test"
          --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: app/go.sum
      - run: go vet ./... && go vet -tags integration ./...
      - name: unit tests
        run: go test -count=1 ./...
      - name: integration tests (real Postgres + Valkey)
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -count=1 -tags integration ./...

  chart-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}
      - name: install yq + kubeconform
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
      - name: render assertions + kubeconform + promtool
        run: bash charts/app/tests/render_test.sh
      - run: helm lint charts/app -f charts/app/tests/values-prod.yaml --kube-version 1.34.0
      - run: helm lint charts/tenant-route --set tenant.name=initech --kube-version 1.34.0

  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - name: install conftest
        run: curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin conftest
      - name: policy unit tests
        run: conftest verify -p policy
      - name: every tenant file passes the onboarding policy (EU residency etc.)
        run: conftest test --combine --namespace tenants -p policy tenants/*.yaml

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: validate every root (local RUN + aws NOT RUN), no backend
        run: |
          set -euo pipefail
          for d in $(find infra/live infra/bootstrap -name 'versions.tf' -exec dirname {} \; 2>/dev/null | sort); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done
      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: load pinned versions
        run: grep -E '^[A-Z_]+=' config/versions.env >> "$GITHUB_ENV"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: misconfiguration scan (fail on HIGH/CRITICAL)
        run: |
          set -euo pipefail
          trivy config --severity HIGH,CRITICAL --exit-code 1 infra
          trivy config --severity HIGH,CRITICAL --exit-code 1 --helm-values charts/app/tests/values-prod.yaml charts/app
          trivy config --severity HIGH,CRITICAL --exit-code 1 --helm-set tenant.name=initech charts/tenant-route
          trivy config --severity HIGH,CRITICAL --exit-code 1 app

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x -S warning $(git ls-files '*.sh')
      - name: LF line endings
        run: bash scripts/tests/eol_test.sh
      - name: script tests (no cluster needed)
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          bash scripts/tests/bump_release_test.sh
